name: Deploy to EC2

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        # .env.production bị gitignore (.gitignore dòng 19) nên phải tiêm qua môi trường.
        # Vite đọc biến VITE_* từ process, và biến môi trường thắng file .env nếu có.
        # Dùng `vars` chứ không phải `secrets`: cả 2 giá trị đều nằm sẵn trong bundle JS
        # gửi cho trình duyệt, đánh dấu secret sẽ gây hiểu nhầm là chúng được giữ kín.
        # Khai ở Settings > Secrets and variables > Actions > Variables.
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - name: Nạp SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.EC2_HOST }}" >> ~/.ssh/known_hosts

      # --delete dọn bundle của các lần build trước: tên file có hash nên không ghi đè lẫn
      # nhau, không xoá thì thư mục phình mãi. An toàn vì index.html để no-store, trình duyệt
      # không giữ bản cũ trỏ vào hash vừa bị xoá.
      # Dấu / cuối "dist/" là bắt buộc: có nó thì rsync đồng bộ NỘI DUNG thư mục, thiếu nó
      # thì nó tạo ra ~/frontend-dist/dist/.
      - name: Đẩy lên EC2
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/ ubuntu@${{ vars.EC2_HOST }}:~/frontend-dist/
